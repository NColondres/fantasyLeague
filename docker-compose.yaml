name: leagueofgoons
services:
  db:
    image: fantasyleague/db
    build:
      context: ./
      dockerfile: ./db/Dockerfile
    ports:
      - 32769:3306
  api:
    image: fantasyleague/api
    build:
      context: ./
      dockerfile: ./api/Dockerfile
    depends_on:
      db:
        condition: service_started
    ports:
      - 8080:8080
    restart: unless-stopped
  sentinel:
    image: fantasyleague/sentinel
    build:
      context: ./
      dockerfile: ./sentinel/Dockerfile
    depends_on:
      db:
        condition: service_started
    restart: unless-stopped
  web:
    image: fantasyleague/web
    build:
      context: ./
      dockerfile: ./web/Dockerfile
    depends_on:
      api:
        condition: service_started
    ports:
      - 4173:4173
    restart: unless-stopped
